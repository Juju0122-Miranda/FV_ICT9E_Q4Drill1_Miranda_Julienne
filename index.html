<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bungee&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Datatype:wght@100..900&display=swap" rel="stylesheet">
    <title>Q4 Drill 1</title>

<style>

    h1{
        background-color: (255, 255, 255.7);
        text-align: center;
        font-family: "Bungee", sans-serif;
        font-size: 45px;
    }

    h2{
        font-size: 35px;
        font-family: "Datatype", monospace;
    }
    </style>
</head>
<body>

 <br><br>
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 100px;">
    
    <div class="col" style="width: 500px;">
        <div style="padding: 40px 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); border-radius: 55px; text-align: center; background-color:#010057; color:white;">
            
            <h1>Electricity Usage Checker</h1>
            <br>

          <h3>kWH Consumption</h3><input type="text" id="consume" class="form-control" placeholder="type here">
            <br><br>
            <button class="btn btn-light" onclick="checkconsume()">Classify Consumption</button>

        </div>
    </div>

</div>
     <script>
        function checkconsume(){ 
            var consume = document.getElementById("consume").value;
            var category1 = "Lifeline Consumer"; 
            var category2 = "Low consumption";
            var category3 = "Average Consumption";
            var category4 = "High Consumption";
            var category5 = "Very High Consumption";
        
        if(isNaN(consume)|| consume < 0 || consume ===""){
            alert("Please input a valid number");
        }

     else if (consume<= 100 ){ 
            alert(category1 + ": Discounted electricity rate");
        }

     else if(consume<=200 ){
            alert(category2 + "Normal residential rate");
         }

     else if(consume<=300 ){
            alert(category3 + "Typical electricity usage");
         }
         
    else if(consume<=500){
            alert(category4 + "Higher electricity usage");
         }

     else{ 
            alert(category5 + "Heavy electricity users");
        }
        }
    </script>

</body>
</html>
